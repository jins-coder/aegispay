version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegispay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegispay
      POSTGRES_PASSWORD: aegispay_dev_secret
      POSTGRES_DB: aegispay_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: aegispay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
