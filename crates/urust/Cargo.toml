[package]
name = "urust"
version = "0.1.0"
edition = "2021"
description = "A lightweight, fine-grained reactive UI library in pure Rust for WebAssembly"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Node",
    "Text",
    "Event",
    "MouseEvent",
    "InputEvent",
    "KeyboardEvent",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "DomTokenList",
    "CssStyleDeclaration",
    "console"
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-utils = "0.2"
